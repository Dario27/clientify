services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      CLIENTIFY_DB: /data/clientify.db
      # 1 cuando se sirve por HTTPS: la cookie de sesión solo viaja cifrada
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      # Correo (recuperar clave): console no envía nada y deja el enlace en el log; ses usa Amazon SES
      EMAIL_BACKEND: ${EMAIL_BACKEND:-console}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      APP_URL: ${APP_URL:-}
      AWS_REGION: ${AWS_REGION:-us-east-2}
    volumes:
      - ./data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "${APP_PORT:-8085}:80"
    depends_on:
      - backend
    restart: unless-stopped

  # HTTPS con dominio propio. Solo corre con el perfil: `docker compose --profile https up -d --build`.
  # Necesita APP_DOMAIN, los puertos 80 y 443 libres y el DNS apuntando al servidor. Con este perfil el
  # frontend ya no debe ocupar el 80: APP_PORT=127.0.0.1:8085 y COOKIE_SECURE=1 en el .env de la raíz.
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # certificados: no borrar, Let's Encrypt limita las emisiones
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
