services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      CLIENTIFY_DB: /data/clientify.db
    volumes:
      - ./data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped
