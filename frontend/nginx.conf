server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API -> contenedor del backend (misma origin, sin CORS)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PWA: el service worker, el manifiesto y la página sin conexión no se guardan en caché,
    # para que cada despliegue los actualice enseguida.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }
    location = /offline.html {
        add_header Cache-Control "no-cache";
    }

    # Assets con hash: caché larga
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: rutas de React Router -> index.html. Sin caché: el navegador pregunta si cambió (ETag, 304 si no)
    # en vez de reutilizar un HTML viejo que apunte a assets con hash que ya no existen tras un despliegue.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
